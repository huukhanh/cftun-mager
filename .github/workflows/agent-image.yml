name: Agent image

# Builds and publishes the mager-agent container image to GitHub Container
# Registry. The image is namespaced under the user (`huukhanh`) rather than
# this repo, so multiple packages from multiple repos share one registry
# namespace — see docs/packages.md for the naming convention.
#
# Triggers:
#   - push to main when agent code or the Dockerfile changes → :main + :sha
#   - tag `agent-v*` (e.g. agent-v0.3.0) → :<version> + :latest
#   - manual via workflow_dispatch (for one-off rebuilds)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent-image.yml"
    tags:
      - "agent-v*"

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: huukhanh/mager-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # tag-rules: latest on default branch, semver from agent-v* tags,
          # short-sha for traceability.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=match,pattern=agent-v(.*),group=1
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=mager-agent
            org.opencontainers.image.description=Mager — self-hosted Cloudflare Tunnel control-plane agent.
            org.opencontainers.image.source=https://github.com/huukhanh/pub-pkg
            org.opencontainers.image.url=https://github.com/huukhanh/pub-pkg/pkgs/container/mager-agent
            org.opencontainers.image.documentation=https://github.com/huukhanh/mager#run-the-agent-in-docker
            org.opencontainers.image.licenses=MIT

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: agent
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
